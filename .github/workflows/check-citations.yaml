name: check-citations

on:
  schedule:
    # 07:00 UTC on the 1st of each month
    - cron: '0 7 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/citations.csv'
      - 'R/**'
      - 'docs/**'
      - 'README.md'
      - 'DESCRIPTION'

permissions:
  contents: read
  issues: write

jobs:
  citations:
    uses: chross22/distsamp/.github/workflows/citation-check-reusable.yaml@main
