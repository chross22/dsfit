name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    uses: chross22/distsamp/.github/workflows/r-cmd-check-reusable.yaml@main
    with:
      # fancyfx is a Suggests and is not on CRAN, so pak needs to be told where
      # to find it. mrds and ggplot2 come from CRAN and need nothing extra; no
      # system libraries are involved, since nothing here touches sf or GDAL.
      extra-packages: 'any::rcmdcheck, github::chross22/fancyfx'
